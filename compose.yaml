# VibeChat Compose — local + Coolify (B-074)
# Coolify: use ONLY this file. Do not define custom networks, container_name, or fixed
# volume names — Coolify creates the stack network and prefixes volumes.
# Assign the public domain to service `web` (container port 80).
#
# Local DX (host ports): compose.dev.yaml
#   docker compose -f compose.yaml -f compose.dev.yaml --profile apps up -d --build
#   (or: task apps)
#
# Profiles: default=data plane | tools | observability | apps | proxy
# Redis is cache/presence only — Postgres is the durable source of truth.

name: vibechat


volumes:
  postgres_data:
  redis_data:
  keycloak_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
  proxy_certbot_www:

services:
  # ---------------------------------------------------------------------------
  # Data plane (default profile)
  # ---------------------------------------------------------------------------
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.6}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vibechat}
      POSTGRES_USER: ${POSTGRES_USER:-vibechat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibechat_dev_password_change_me}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-vibechat_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-vibechat_app_password_change_me}
      POSTGRES_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:-vibechat_migrator}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-vibechat_migrator_password_change_me}
      POSTGRES_BACKUP_USER: ${POSTGRES_BACKUP_USER:-vibechat_backup}
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD:-vibechat_backup_password_change_me}
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_password_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/compose/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./infra/compose/postgres/02-keycloak.sh:/docker-entrypoint-initdb.d/02-keycloak.sh:ro
      - ./infra/compose/postgres/03-app-roles.sh:/docker-entrypoint-initdb.d/03-app-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: ${REDIS_IMAGE:-redis:8.10-alpine}
    restart: unless-stopped
    # appendonly yes: AOF helps survive restarts for cache/presence, but Redis
    # remains NOT the durable source of truth for chat data (see Postgres).
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.0.2}
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_password_change_me}
      KC_DB_SCHEMA: ${KEYCLOAK_DB_SCHEMA:-public}
      # Full public URL when behind path proxy, e.g. https://host/auth (Keycloak 26
      # hostname v2). Hostname-only is fine for local lab (compose.override sets port).
      # Do NOT set KC_HOSTNAME_PORT here — it breaks HTTPS public URLs on Coolify.
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      # Staging path-based: /auth (vazio no lab local). Must match path in KC_HOSTNAME.
      KC_HTTP_RELATIVE_PATH: ${KEYCLOAK_HTTP_RELATIVE_PATH:-}
      # Coolify / Traefik TLS termination — forwarded proto/host
      KC_PROXY_HEADERS: ${KEYCLOAK_PROXY_HEADERS:-}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_password_change_me}
      VIBECHAT_INITIAL_ADMIN_PASSWORD: ${VIBECHAT_INITIAL_ADMIN_PASSWORD:-}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ${KEYCLOAK_REALM_IMPORT_FILE:-./infra/keycloak/realm-vibechat.json}:/opt/keycloak/data/import/realm-vibechat.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2024-12-18T13-15-44Z}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_password_change_me}
      # Bucket CORS (mc cors set) is AIStor-only; community MinIO uses global CORS.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:4200,https://localhost:4200,*}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  createbucket:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-08-13T08-35-41Z}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      i=0;
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
        i=$$((i+1));
        if [ $$i -ge 30 ]; then echo 'MinIO not ready' >&2; exit 1; fi;
        sleep 2;
      done;
      mc mb --ignore-existing local/$${MINIO_BUCKET:-vibechat};
      echo 'MinIO bucket ready: $${MINIO_BUCKET:-vibechat}';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_password_change_me}
      MINIO_BUCKET: ${MINIO_BUCKET:-vibechat}
    restart: "no"

  # ---------------------------------------------------------------------------
  # Tools profile
  # ---------------------------------------------------------------------------
  mailpit:
    profiles: ["tools"]
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.21.0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Observability profile
  # ---------------------------------------------------------------------------
  otel-collector:
    profiles: ["observability"]
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.115.1}
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:13133/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  prometheus:
    profiles: ["observability"]
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.13.2}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  grafana:
    profiles: ["observability"]
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.4.0}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana_dev_password_change_me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:${GRAFANA_PORT:-3000}}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GRAFANA_SERVE_FROM_SUB_PATH:-false}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  loki:
    profiles: ["observability"]
    image: ${LOKI_IMAGE:-grafana/loki:3.2.1}
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./infra/observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  tempo:
    profiles: ["observability"]
    image: ${TEMPO_IMAGE:-grafana/tempo:3.0.2}
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./infra/observability/tempo-config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ---------------------------------------------------------------------------
  # App services (profile: apps) — official self-host/demo path (B-074).
  # Day-to-day DX with hot reload: prefer `task dev` against the data plane.
  # ---------------------------------------------------------------------------
  api:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: vibechat-api:local
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5080
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-vibechat};Username=${POSTGRES_APP_USER:-vibechat_app};Password=${POSTGRES_APP_PASSWORD:-vibechat_app_password_change_me}
      ConnectionStrings__DatabaseMigrator: Host=postgres;Port=5432;Database=${POSTGRES_DB:-vibechat};Username=${POSTGRES_MIGRATOR_USER:-vibechat_migrator};Password=${POSTGRES_MIGRATOR_PASSWORD:-vibechat_migrator_password_change_me}
      ConnectionStrings__DatabaseBootstrap: Host=postgres;Port=5432;Database=${POSTGRES_DB:-vibechat};Username=${POSTGRES_USER:-vibechat};Password=${POSTGRES_PASSWORD:-vibechat_dev_password_change_me}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-vibechat_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-vibechat_app_password_change_me}
      POSTGRES_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:-vibechat_migrator}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-vibechat_migrator_password_change_me}
      POSTGRES_BACKUP_USER: ${POSTGRES_BACKUP_USER:-vibechat_backup}
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD:-vibechat_backup_password_change_me}
      ConnectionStrings__Redis: redis:6379
      # Public issuer must match browser token `iss`; discovery uses in-network MetadataAddress.
      Authentication__Authority: ${KEYCLOAK_ISSUER_URL:-http://localhost:8080/realms/vibechat}
      Authentication__MetadataAddress: http://keycloak:8080${KEYCLOAK_HTTP_RELATIVE_PATH:-}/realms/${KEYCLOAK_REALM:-vibechat}/.well-known/openid-configuration
      Authentication__Audience: ${OIDC_API_AUDIENCE:-vibechat-api}
      Authentication__RequireHttpsMetadata: "false"
      Minio__Endpoint: minio:9000
      Minio__PublicEndpoint: ${MINIO_ENDPOINT:-http://localhost:9000}
      Minio__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_password_change_me}
      Minio__Bucket: ${MINIO_BUCKET:-vibechat}
      Minio__UseSsl: "false"
      Files__MaxSizeBytes: "10485760"
      Ai__Enabled: ${AI__Enabled:-false}
      Ai__Provider: ${AI__Provider:-Mock}
      Ai__OpenRouter__ApiKey: ${OPENROUTER_API_KEY:-}
      Ai__OpenRouter__BaseUrl: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      Email__Enabled: ${EMAIL__Enabled:-false}
      Email__Smtp__Host: ${EMAIL__Smtp__Host:-localhost}
      Email__Smtp__Port: ${EMAIL__Smtp__Port:-1025}
      Email__Smtp__Username: ${EMAIL__Smtp__Username:-}
      Email__Smtp__Password: ${EMAIL__Smtp__Password:-}
      Email__Smtp__From: ${EMAIL__Smtp__From:-noreply@vibechat.local}
      Email__Smtp__UseStartTls: ${EMAIL__Smtp__UseStartTls:-false}
      LinkPreview__Enabled: ${LinkPreview__Enabled:-true}
      LinkPreview__TimeoutMs: ${LinkPreview__TimeoutMs:-8000}
      RuntimeSettings__DatabaseOverridesEnabled: ${RuntimeSettings__DatabaseOverridesEnabled:-false}
      RuntimeSettings__Encryption__ActiveKeyVersion: ${RuntimeSettings__Encryption__ActiveKeyVersion:-1}
      RuntimeSettings__Encryption__Keys__1: ${RuntimeSettings__Encryption__Keys__1:-}
      Database__BootstrapOnStartup: ${DATABASE_BOOTSTRAP_ON_STARTUP:-false}
      Seed__Enabled: ${SEED_ENABLED:-false}
      Seed__InitialAdminEmail: ${SEED_INITIAL_ADMIN_EMAIL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  web:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22.22.3-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.31.3-alpine}
        API_BASE_URL: ${API_BASE_URL:-http://localhost:5080}
        KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:${KEYCLOAK_HTTP_PORT:-8080}}
        KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:${KEYCLOAK_HTTP_PORT:-8080}}
        KEYCLOAK_REALM: ${KEYCLOAK_REALM:-vibechat}
        OIDC_WEB_CLIENT_ID: ${OIDC_WEB_CLIENT_ID:-vibechat-web}
        GRAFANA_URL: ${GRAFANA_ROOT_URL:-http://localhost:${GRAFANA_PORT:-3000}}
    image: vibechat-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  worker:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: vibechat-worker:local
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-vibechat};Username=${POSTGRES_APP_USER:-vibechat_app};Password=${POSTGRES_APP_PASSWORD:-vibechat_app_password_change_me}
      ConnectionStrings__Redis: redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      Minio__Endpoint: minio:9000
      Minio__PublicEndpoint: ${MINIO_ENDPOINT:-http://localhost:9000}
      Minio__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_password_change_me}
      Minio__Bucket: ${MINIO_BUCKET:-vibechat}
      Minio__UseSsl: "false"
      MessageRetention__Enabled: ${MessageRetention__Enabled:-false}
      MessageRetention__DefaultRetentionDays: ${MessageRetention__DefaultRetentionDays:-90}
      MessageRetention__BatchSize: ${MessageRetention__BatchSize:-500}
      MessageRetention__IntervalMinutes: ${MessageRetention__IntervalMinutes:-60}
      LinkPreview__Enabled: ${LinkPreview__Enabled:-true}
      LinkPreview__TimeoutMs: ${LinkPreview__TimeoutMs:-8000}
      RuntimeSettings__DatabaseOverridesEnabled: ${RuntimeSettings__DatabaseOverridesEnabled:-false}
      RuntimeSettings__Encryption__ActiveKeyVersion: ${RuntimeSettings__Encryption__ActiveKeyVersion:-1}
      RuntimeSettings__Encryption__Keys__1: ${RuntimeSettings__Encryption__Keys__1:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ---------------------------------------------------------------------------
  # TLS edge proxy (profile: proxy) — reference config (W5-2 / D-05)
  # Generate local certs first: ./infra/proxy/generate-dev-certs.sh
  # Production: mount real fullchain.pem + privkey.pem (never commit secrets).
  # ---------------------------------------------------------------------------
  proxy:
    profiles: ["proxy"]
    image: ${NGINX_IMAGE:-nginx:1.31.3-alpine}
    restart: unless-stopped
    volumes:
      - ./infra/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/security-headers.conf:/etc/nginx/vibechat/security-headers.conf:ro
      - ./infra/proxy/certs:/etc/nginx/certs:ro
      - proxy_certbot_www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/proxy-healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
