# Local development overrides for constrained Cloud Agent / host-dev environments
# where Docker bridge routing is unreliable. Uses host networking for the data plane.
# Normal developer machines can delete or empty this file if bridge networking works.
# Do not put production secrets here.
#
# Official self-host path (B-074 / W6-8) ignores this file:
#   docker compose -f compose.yaml --profile apps up -d
#   (or: task apps)

services:
  postgres:
    network_mode: host
    networks: !reset []

  redis:
    network_mode: host
    networks: !reset []
    command: ["redis-server", "--appendonly", "yes", "--bind", "0.0.0.0"]

  minio:
    network_mode: host
    networks: !reset []
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]

  createbucket:
    network_mode: host
    networks: !reset []
    depends_on: !reset {}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until mc alias set local http://127.0.0.1:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
          echo 'waiting for minio...';
          sleep 2
        done
        mc mb --ignore-existing local/$${MINIO_BUCKET:-vibechat}
        printf '%s' '{"CORSRules":[{"AllowedOrigins":["http://localhost:4200","https://localhost:4200","*"],"AllowedMethods":["GET","PUT","HEAD"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag","Content-Length"],"MaxAgeSeconds":3600}]}' >/tmp/cors.json
        mc cors set local/$${MINIO_BUCKET:-vibechat} /tmp/cors.json || true
        echo 'MinIO bucket ready: $${MINIO_BUCKET:-vibechat}'

  keycloak:
    network_mode: host
    networks: !reset []
    depends_on: !reset {}
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://127.0.0.1:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_dev_password_change_me
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9002"
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_dev_password_change_me
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  otel-collector:
    profiles: ["observability"]
    ports:
      - "4317:4317"
      - "4318:4318"
