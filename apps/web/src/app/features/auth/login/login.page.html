<section class="login-hero" aria-labelledby="brand-title">
  <div class="login-hero__atmosphere" aria-hidden="true"></div>
  <div class="login-hero__pattern" aria-hidden="true"></div>

  <header class="login-hero__top">
    <vc-locale-control />
    <vc-theme-toggle />
  </header>

  <div class="login-hero__content vc-anim-fade-in">
    <p class="login-hero__brand" id="brand-title">VibeChat</p>
    <h1>{{ ui.loginHeadline }}</h1>
    <p class="login-hero__lead">
      {{ ui.loginLead }}
    </p>
    <div class="login-hero__cta">
      <vc-button variant="primary" [loading]="loading" (click)="login()">{{ ui.loginCta }}</vc-button>
    </div>
    @if (enableDevAuth) {
      <div class="login-hero__dev" [attr.aria-label]="ui.loginDevGroup">
        <p>{{ ui.loginDevTitle }}</p>
        <div class="login-hero__dev-actions">
          <vc-button variant="ghost" (click)="enterDev('alice')">Alice</vc-button>
          <vc-button variant="ghost" (click)="enterDev('bob')">Bob</vc-button>
          <vc-button variant="ghost" (click)="enterDev('demo')">Demo</vc-button>
        </div>
        <button type="button" class="login-hero__offline" (click)="enterOfflineDemo()">
          {{ ui.loginOffline }}
        </button>
      </div>
    }
    @if (error()) {
      <p class="login-hero__error" role="alert">{{ error() }}</p>
    }
  </div>
</section>
