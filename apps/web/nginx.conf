server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/vibechat/security-headers.conf;

    # Docker embedded DNS — variable upstream so nginx starts even if `api`
    # is not yet resolvable (Compose depends_on / rolling start).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:5080;

    # B-165: shell / SW manifesto / versão pública sem cache agressivo.
    # Re-include security headers: location-level add_header drops server inheritance.
    location = / {
        include /etc/nginx/vibechat/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    location = /index.html {
        include /etc/nginx/vibechat/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /ngsw.json {
        include /etc/nginx/vibechat/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /version.json {
        include /etc/nginx/vibechat/security-headers.conf;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Content-hashed bundles from the Angular builder.
    # Quote the regex: unquoted `{8,}` is parsed as an nginx block opener.
    location ~* "\.[0-9a-f]{8,}\.(js|css)$" {
        include /etc/nginx/vibechat/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Angular SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional reverse-proxy for same-origin /api and /hubs (variable upstream
    # must omit URI path so nginx forwards the full client request URI).
    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
