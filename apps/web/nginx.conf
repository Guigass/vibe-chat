# Included from nginx http context (conf.d). Coolify/Traefik sets X-Forwarded-Proto.
map $http_x_forwarded_proto $vc_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    include /etc/nginx/vibechat/security-headers.conf;

    # Docker embedded DNS — variable upstream so nginx starts even if backends
    # are not yet resolvable (Compose depends_on / rolling start).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:5080;
    set $keycloak_upstream keycloak:8080;
    set $minio_upstream minio:9000;
    set $grafana_upstream grafana:3000;

    # B-165: shell / SW manifesto / versão pública sem cache agressivo.
    # Re-include security headers: location-level add_header drops server inheritance.
    location = / {
        include /etc/nginx/vibechat/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    location = /index.html {
        include /etc/nginx/vibechat/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /ngsw.json {
        include /etc/nginx/vibechat/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /version.json {
        include /etc/nginx/vibechat/security-headers.conf;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # OIDC callbacks da SPA (exact match) — não confundir com Keycloak em /auth/
    location = /auth/callback {
        include /etc/nginx/vibechat/security-headers.conf;
        try_files /index.html =404;
    }

    location = /auth/silent-renew {
        include /etc/nginx/vibechat/security-headers.conf;
        try_files /index.html =404;
    }

    # Hashed Angular/esbuild assets
    location ~* \.(js|css|mjs)$ {
        include /etc/nginx/vibechat/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # REST API
    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $vc_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # SignalR hub (WebSocket)
    location /hubs/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $vc_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Keycloak (KC_HTTP_RELATIVE_PATH=/auth em staging)
    location /auth/ {
        proxy_pass http://$keycloak_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $vc_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
    }

    # MinIO S3 path-style (bucket público = "files" → /files/...)
    location /files/ {
        proxy_pass http://$minio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $vc_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 12m;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Grafana (profile observability; GF_SERVER_SERVE_FROM_SUB_PATH)
    location /grafana/ {
        proxy_pass http://$grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $vc_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /grafana {
        return 301 /grafana/;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Angular SPA fallback (depois dos prefixos de backend)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
