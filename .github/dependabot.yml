# B-076 / W7-3 — atualização automatizada de dependências (Dependabot OSS).
# Política de triagem, SLA e rollback: docs/operations/dependencias.md
# Updates rotineiros pausados durante a construção do roadmap; security updates
# continuam disponíveis. Reativar conscientemente ao iniciar a rodada humana.
version: 2

updates:
  # NuGet — solution na raiz
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 0
    groups:
      nuget-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"
      include: scope

  # npm — Angular web
  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 0
    groups:
      web-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"
      include: scope

  # npm — Playwright E2E
  - package-ecosystem: npm
    directory: "/tests/e2e"
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 0
    groups:
      e2e-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"
      include: scope

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: thursday
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 0
    groups:
      actions-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"
      include: scope

  # Docker — Dockerfiles das apps (FROM / ARG defaults quando o parser cobrir)
  - package-ecosystem: docker
    directories:
      - "/apps/api"
      - "/apps/worker"
      - "/apps/web"
    schedule:
      interval: weekly
      day: friday
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
      include: scope

  # Docker Compose — pins do data plane e build-args em compose.yaml
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
      include: scope
