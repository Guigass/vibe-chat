name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

# push + pull_request on cursor/** both fire for the same commit - dedupe cost.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Dependabot config (B-076)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          try:
              import yaml
          except ImportError:
              import subprocess
              subprocess.check_call([sys.executable, "-m", "pip", "install", "--user", "pyyaml"])
              import yaml
          path = Path(".github/dependabot.yml")
          assert path.is_file(), "missing .github/dependabot.yml"
          cfg = yaml.safe_load(path.read_text())
          assert cfg.get("version") == 2, cfg.get("version")
          updates = cfg.get("updates") or []
          assert updates, "updates[] empty"
          ecosystems = {u.get("package-ecosystem") for u in updates}
          required = {"nuget", "npm", "docker", "docker-compose", "github-actions"}
          missing = required - ecosystems
          assert not missing, f"missing ecosystems: {sorted(missing)}"
          for u in updates:
              assert "directory" in u or "directories" in u, u
              assert "schedule" in u and "interval" in u["schedule"], u
              limit = u.get("open-pull-requests-limit")
              assert limit is not None and int(limit) == 0, u
              schedule = u["schedule"]
              assert schedule.get("time") == "06:00", u
              assert schedule.get("timezone") == "America/Sao_Paulo", u
          days = {u["schedule"].get("day") for u in updates}
          assert len(days) == len(updates), "Dependabot schedules must be staggered"
          print("dependabot.yml OK:", ", ".join(sorted(ecosystems)))
          PY

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Restore
        run: dotnet restore VibeChat.slnx

      - name: Format check
        run: dotnet format VibeChat.slnx --verify-no-changes --verbosity minimal

      - name: Build
        run: dotnet build VibeChat.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/unit/VibeChat.UnitTests.csproj -c Release --no-build --verbosity minimal

      - name: Architecture tests
        run: dotnet test tests/architecture/VibeChat.ArchitectureTests.csproj -c Release --no-build --verbosity minimal

      - name: Security tests (Testcontainers)
        run: dotnet test tests/security/VibeChat.SecurityTests.csproj -c Release --no-build --verbosity minimal

      - name: Integration tests (Testcontainers)
        run: dotnet test tests/integration/VibeChat.IntegrationTests.csproj -c Release --no-build --verbosity minimal

      - name: Web install & typecheck
        working-directory: apps/web
        run: |
          npm ci
          if node -e "const j=require('./angular.json'); process.exit(j.projects?.web?.architect?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "ng lint not configured; running tsc --noEmit"
            npx tsc -p tsconfig.app.json --noEmit
          fi

      - name: Dependency inventory (SBOM-lite)
        run: |
          mkdir -p artifacts/sbom
          dotnet list VibeChat.slnx package --include-transitive > artifacts/sbom/dotnet-packages.txt
          (cd apps/web && npm ls --all --omit=dev > ../../artifacts/sbom/npm-packages.txt) || true
          echo "Package inventory written to artifacts/sbom/"

      - name: Upload SBOM-lite artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-lite
          path: artifacts/sbom/
          if-no-files-found: warn

  # W7-1 / B-075 — Playwright vertical-slice E2E (DevAuth; no Keycloak).
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      COMPOSE_FILE: compose.yaml
      E2E_AUTH_MODE: devauth
      WEB_BASE_URL: http://localhost:4200
      API_BASE_URL: http://localhost:5080
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Angular 22 requires >= 22.22.3 (same floor as apps/web engines + AGENTS.md).
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            tests/e2e/package-lock.json

      - name: Restore API
        run: dotnet restore VibeChat.slnx

      - name: Build API
        run: dotnet build apps/api/VibeChat.Api.csproj -c Release --no-restore

      - name: Install web deps
        run: npm ci --prefix apps/web

      - name: Install e2e deps
        run: npm ci --prefix tests/e2e

      - name: Run E2E (DevAuth stack)
        run: |
          chmod +x infra/scripts/ci-e2e.sh infra/scripts/wait-for-healthy.sh
          ./infra/scripts/ci-e2e.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            /tmp/vibechat-e2e-api.log
            /tmp/vibechat-e2e-web.log
          if-no-files-found: warn

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Prefer CLI scan to avoid gitleaks-action PR API permission issues on forks/restricted tokens.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Gitleaks scan
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --redact

  dependency-audit:
    name: Dependency audit notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Restore & audit
        run: |
          dotnet restore VibeChat.slnx
          echo "::notice::Running vulnerable package scan (may be empty without vulnerability data feeds)"
          dotnet list VibeChat.slnx package --vulnerable --include-transitive || true
          npm ci --prefix apps/web
          npm audit --prefix apps/web --omit=dev || true
          echo "Audit commands are informational until vulnerability advisories are enforced as hard gates."
