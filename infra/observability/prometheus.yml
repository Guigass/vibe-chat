# Prometheus scrape config — VibeChat local stack

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: vibechat-local
    env: development

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: otel-collector-exported
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]

  # ASP.NET Core / OpenTelemetry Prometheus scrape (when apps expose /metrics)
  - job_name: vibechat-api
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["api:5080", "host.docker.internal:5080"]
        labels:
          service: vibechat-api

  - job_name: vibechat-worker
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["worker:8080", "host.docker.internal:8081"]
        labels:
          service: vibechat-worker
