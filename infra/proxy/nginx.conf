# VibeChat — reference reverse proxy (TLS termination)
# Used by Compose profile `proxy`. Upstream names match compose service names.
# Secrets/certs are mounted at runtime; never commit real private keys.
#
# Upstream hosts are resolved via Docker embedded DNS (variables + resolver)
# so nginx can start before api/web are ready and `nginx -t` stays usable.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 12m;

    # Docker Compose DNS
    resolver 127.0.0.11 ipv6=off valid=30s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Redirect HTTP → HTTPS (keep ACME + local health on :80)
    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location = /proxy-healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # HSTS + shared CSP (B-077) — proxy is the canonical HTTPS edge
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        include /etc/nginx/vibechat/security-headers.conf;

        # SPA + static (apps/web nginx container)
        location / {
            set $upstream_web web:80;
            proxy_pass http://$upstream_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }

        # REST API
        location /api/ {
            set $upstream_api api:5080;
            proxy_pass http://$upstream_api/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }

        # SignalR hub (WebSocket)
        location /hubs/ {
            set $upstream_api api:5080;
            proxy_pass http://$upstream_api/hubs/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Health of the edge proxy itself
        location = /proxy-healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }
    }
}
