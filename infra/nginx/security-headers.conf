# B-077 — shared security headers for web container and TLS proxy (canonical edge).
# Lab defaults allow localhost Keycloak (8080) and MinIO (9000) for OIDC and presigned uploads.
# Production: extend connect-src/frame-src with HTTPS public URLs — see docs/operations/runbooks/tls-proxy.md

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; connect-src 'self' wss: https://fonts.googleapis.com https://fonts.gstatic.com http://localhost:8080 http://127.0.0.1:8080 http://localhost:9000 http://127.0.0.1:9000; frame-src 'self' http://localhost:8080 http://127.0.0.1:8080; form-action 'self'" always;
