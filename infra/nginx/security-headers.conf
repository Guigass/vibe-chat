# B-077 — shared security headers for web container and TLS proxy (canonical edge).
# Lab: localhost API/KC/MinIO. Staging same-origin path edge: 'self' cobre /api /auth /files /grafana.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# B-163: img-src/media-src need MinIO so inline attachment preview (image/audio/video) works.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: http://localhost:9000 http://127.0.0.1:9000; media-src 'self' blob: http://localhost:9000 http://127.0.0.1:9000; worker-src 'self' blob:; manifest-src 'self'; connect-src 'self' ws: wss: https://fonts.googleapis.com https://fonts.gstatic.com http://localhost:5080 http://127.0.0.1:5080 ws://localhost:5080 ws://127.0.0.1:5080 http://localhost:8080 http://127.0.0.1:8080 http://localhost:9000 http://127.0.0.1:9000; frame-src 'self' http://localhost:8080 http://127.0.0.1:8080; form-action 'self'" always;
